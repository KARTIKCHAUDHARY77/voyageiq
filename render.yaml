services:
  # ─── Flask Backend ───────────────────────────────────────────────────────
  - type: web
    name: voyageiq-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app('production')" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voyageiq-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://voyageiq.vercel.app,https://voyageiq-frontend.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.9

  # ─── PostgreSQL Database ─────────────────────────────────────────────────
databases:
  - name: voyageiq-db
    databaseName: voyageiq
    user: voyageiq_user
    plan: free
